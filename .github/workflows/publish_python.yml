# Publish all Python packages to PyPI.
#
# Triggered by pushing a tag like v0.7.0 or manually via workflow_dispatch.
# Auth uses PyPI trusted publishing (OIDC) — no API tokens needed.

name: Publish Python

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: publish-python-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: pypi_github_publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          python-version: "3.12"
          version: "0.6.6"

      - name: Build and publish packages
        run: |
          set -uo pipefail

          # Publish all core and plugin packages for this release.
          PACKAGES=(
            packages/genkit
            packages/genkit-a2ui
            packages/genkit-amazon-bedrock
            packages/genkit-anthropic
            packages/genkit-django
            packages/genkit-evaluators
            packages/genkit-fastapi
            packages/genkit-flask
            packages/genkit-google-cloud
            packages/genkit-google-genai
            packages/genkit-mcp
            packages/genkit-middleware
            packages/genkit-ollama
            packages/genkit-openai
            packages/genkit-otel
            packages/genkit-vertexai
          )

          FAILED=()
          for pkg in "${PACKAGES[@]}"; do
            echo "::group::$pkg"
            if uv build "$pkg" --out-dir dist/; then
              echo "Build succeeded: $pkg"
            else
              echo "::error::Build failed: $pkg"
              FAILED+=("$pkg")
            fi
            echo "::endgroup::"
          done

          # Python-floor shim (genkit 0.3.0): gives Python <= 3.9 users a clear
          # upgrade message instead of resolving an unrelated pre-transfer
          # package. sdist ONLY - a wheel would install as an empty package on
          # old Pythons. skip-existing makes this a no-op after first publish.
          # See floor-shim/README.md.
          echo "::group::floor-shim (sdist only)"
          if uv build --sdist floor-shim --out-dir dist/; then
            echo "Build succeeded: floor-shim"
          else
            echo "::error::Build failed: floor-shim"
            FAILED+=("floor-shim")
          fi
          echo "::endgroup::"

          if [ ${#FAILED[@]} -gt 0 ]; then
            echo "::error::Failed packages: ${FAILED[*]}"
            exit 1
          fi

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
          verbose: true
          skip-existing: true

  verify:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Smoke test
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          pip install "genkit==${VERSION}"
          python -c "from genkit import Genkit; Genkit(); print('ok')"
