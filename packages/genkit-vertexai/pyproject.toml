[project]
authors = [
  { name = "Google" },
  { name = "Yesudeep Mangalapilly", email = "yesudeep@google.com" },
  { name = "Elisa Shen", email = "mengqin@google.com" },
  { name = "Niraj Nepal", email = "nnepal@google.com" },
]
classifiers = [
  "Development Status :: 7 - Inactive",
  "Environment :: Console",
  "Environment :: Web Environment",
  "Framework :: AsyncIO",
  "Framework :: Pydantic",
  "Framework :: Pydantic :: 2",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
  "Typing :: Typed",
  "License :: OSI Approved :: Apache Software License",
]
dependencies = [
  "genkit>=0.13.0,<1",
  "genkit-model-garden>=0.13.0,<1",
]
description = "Deprecated: renamed to genkit-model-garden"
keywords = [
  "genkit",
  "model-garden",
  "vertex-ai",
]
license = "Apache-2.0"
name = "genkit-vertexai"
readme = "README.md"
requires-python = ">=3.10"
version = "0.13.0"

[project.optional-dependencies]
anthropic = ["genkit-model-garden[anthropic]>=0.13.0,<1"]
openai    = ["genkit-model-garden[openai]>=0.13.0,<1"]

[project.urls]
"Bug Tracker"   = "https://github.com/genkit-ai/genkit-python/issues"
Changelog       = "https://github.com/genkit-ai/genkit-python/releases"
"Documentation" = "https://genkit.dev/docs/get-started/?lang=python"
"Homepage"      = "https://github.com/genkit-ai/genkit-python"
"Repository"    = "https://github.com/genkit-ai/genkit-python"

[build-system]
build-backend = "hatchling.build"
requires      = ["hatchling"]

[tool.hatch.build.targets.wheel]
only-include = ["src/genkit_vertexai"]
sources      = ["src"]
