version: 2

# Policy notes:
# 1. Cooldowns satisfy zizmor (`dependabot-cooldown` >= 7d).
# 2. The `uv` workspace batches `minor` + `patch` into one weekly PR. Majors aren't
#    ignored and aren't grouped: each gets its own PR, because each needs its own
#    review (cap diff, changelog, contract or not) and one red major shouldn't
#    block the others. Security/CVE updates bypass `cooldown` and open standalone PRs.
updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"

  # Maintain dependencies for Python (uv workspace)
  # Majors open one PR per dep instead of being ignored: a green one widens the
  # cap, a red one is the migration ticket. See docs/dependencies.md.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      py-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      # Majors open one PR per dep, except families that release in lockstep:
      # splitting those would leave each PR unresolvable (sdk 2 needs api 2).
      opentelemetry-major:
        patterns:
          - "opentelemetry-*"
        update-types:
          - "major"
      aws-major:
        patterns:
          - "boto3"
          - "botocore"
        update-types:
          - "major"
