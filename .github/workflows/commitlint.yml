name: Commit Lint

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  commitlint:
    name: commitlint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@0a44ba7841725637a54e280ec667c276c6cc814e # v4.1.0
        with:
          node-version: 20

      - name: Install commitlint
        run: npm install --no-save @commitlint/cli@^19.0.0 @commitlint/config-conventional@^19.0.0

      - name: Validate PR title (used as squash commit message)
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "$PR_TITLE" | npx commitlint --config .github/commitlint.config.js
