name: Python Samples

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-samples:
    name: Build (${{ matrix.sample }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        sample:
          - agents
          - amazon-bedrock-sample
          - anthropic-sample
          - basic-flows
          - context
          - django-hello
          - evaluators
          - flask-hello
          - gemini-code-execution
          - gemini-context-caching
          - google-genai-deep-research
          - google-genai-media
          - mcp-hello
          - middleware
          - multipart-tools
          - otel-jaeger
          - output-formats
          - prompts
          - tool-interrupts
          - tracing
          - vertexai-image
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and setup Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install sample dependencies
        env:
          SAMPLE_NAME: ${{ matrix.sample }}
        run: |
          uv sync --package "$SAMPLE_NAME"

      - name: Verify sample syntax
        env:
          SAMPLE_NAME: ${{ matrix.sample }}
        run: |
          cd "samples/$SAMPLE_NAME"
          uv run python -m py_compile src/main.py
          echo "Sample $SAMPLE_NAME syntax OK"

  ollama-samples:
    name: Ollama (${{ matrix.sample }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - sample: ollama-sample
            models: "gemma3:1b"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and setup Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Setup Ollama with model caching
        uses: ./.github/actions/setup-ollama
        with:
          models: ${{ matrix.models }}

      - name: Install sample dependencies
        env:
          SAMPLE_NAME: ${{ matrix.sample }}
        run: |
          uv sync --package "$SAMPLE_NAME"

      - name: Verify sample syntax
        env:
          SAMPLE_NAME: ${{ matrix.sample }}
        run: |
          cd "samples/$SAMPLE_NAME"
          uv run python -m py_compile src/main.py
          echo "Sample $SAMPLE_NAME syntax OK"
