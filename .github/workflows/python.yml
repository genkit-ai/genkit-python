name: Python Checks

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint-and-format:
    name: Lint and Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and setup Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen --group lint

      - name: Check lockfile is up to date
        run: uv lock --check

      - name: Format check
        run: uv run --no-sync ruff format --check --preview .

      - name: Lint with ruff
        run: uv run --no-sync ruff check --preview .

      - name: Run consistency checks
        run: python3 ./scripts/check_consistency.py

  type-check:
    name: Type Check (${{ matrix.checker }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        checker: [ty, pyrefly, pyright]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential libffi-dev cmake libjpeg-dev zlib1g-dev

      - name: Install uv and setup Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen --group lint

      - name: Generate schema typing
        run: ./bin/generate_schema_typing --ci

      - name: Type check with Ty
        if: matrix.checker == 'ty'
        run: uv run --no-sync ty check .

      - name: Type check with Pyrefly
        if: matrix.checker == 'pyrefly'
        run: uv run --no-sync pyrefly check

      - name: Type check with Pyright
        if: matrix.checker == 'pyright'
        run: uv run --no-sync pyright

  security-and-compliance:
    name: Security and Compliance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and setup Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen --group lint

      - name: Check source file license headers
        run: ./bin/check_license

      - name: Check Python dependency licenses
        run: uv run --no-sync liccheck -s pyproject.toml

      - name: Check for hardcoded secrets
        run: |
          if grep -rE "(sk-[a-zA-Z0-9]{20,}|AIza[a-zA-Z0-9_-]{35}|AKIA[0-9A-Z]{16})" \
              packages/ samples/ --include="*.py" | grep -vE "test|mock|fake|example|#"; then
            echo "::error::Potential hardcoded secrets found"
            exit 1
          fi
          echo "No hardcoded secrets detected"

  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
      fail-fast: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libffi-dev cmake libjpeg-dev zlib1g-dev

      - name: Install uv and setup Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        env:
          PY_VER: ${{ matrix.python-version }}
        run: uv sync --frozen --python "$PY_VER"

      - name: Generate schema typing
        run: ./bin/generate_schema_typing --ci

      - name: Fetch cross-SDK conformance specs
        run: |
          SPEC_DIR="${RUNNER_TEMP:-/tmp}/genkit-specs"
          mkdir -p "$SPEC_DIR"
          curl -sSfL https://raw.githubusercontent.com/genkit-ai/genkit/main/tests/specs/agent.yaml -o "$SPEC_DIR/agent.yaml"
          curl -sSfL https://raw.githubusercontent.com/genkit-ai/genkit/main/tests/specs/generate.yaml -o "$SPEC_DIR/generate.yaml"
          curl -sSfL https://raw.githubusercontent.com/genkit-ai/genkit/main/tests/specs/reflection_api.yaml -o "$SPEC_DIR/reflection_api.yaml"
          curl -sSfL https://raw.githubusercontent.com/genkit-ai/genkit/main/tests/flow_server_tests.yaml -o "$SPEC_DIR/flow_server_tests.yaml"
          curl -sSfL https://raw.githubusercontent.com/genkit-ai/genkit/main/genkit-tools/genkit-schema.json -o "$SPEC_DIR/genkit-schema.json"
          echo "GENKIT_SPECS_DIR=$SPEC_DIR" >> "$GITHUB_ENV"

      - name: Run tests
        env:
          PY_VER: ${{ matrix.python-version }}
          COVERAGE_CORE: sysmon
        run: |
          if [[ "$PY_VER" == "3.12" ]]; then
            uv run --no-sync --python "$PY_VER" \
              pytest --cov --cov-report=term-missing:skip-covered
          else
            uv run --no-sync --python "$PY_VER" pytest
          fi

  build:
    name: Build Distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    if: always() && !failure() && !cancelled()
    needs: [lint-and-format, type-check, security-and-compliance, tests]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Build and verify distributions
        run: ./bin/build_dists

      - name: Install each wheel in an isolated venv
        run: ./bin/check_isolated_wheels

      - name: Verify wheel contents
        run: |
          ERRORS=0
          for wheel in dist/*.whl; do
            if [[ -f "$wheel" ]]; then
              wheel_name=$(basename "$wheel" | sed 's/-[0-9].*//')
              if [[ "$wheel_name" == "genkit" ]] || [[ "$wheel_name" == genkit_* ]]; then
                echo "Checking $wheel_name..."
                if ! unzip -l "$wheel" 2>/dev/null | grep -qE "py\.typed$"; then
                  echo "::error::Wheel $wheel_name missing py.typed"
                  ERRORS=$((ERRORS + 1))
                fi
                if ! unzip -l "$wheel" 2>/dev/null | grep -qE "(LICENSE|licenses/LICENSE)"; then
                  echo "::error::Wheel $wheel_name missing LICENSE"
                  ERRORS=$((ERRORS + 1))
                fi
              fi
            fi
          done
          if [[ "$ERRORS" -gt 0 ]]; then
            echo "::error::$ERRORS wheel verification errors found"
            exit 1
          fi

      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-distributions
          path: dist/
          retention-days: 7

  # =============================================================================
  # Single fan-in gate job for branch protection required_status_checks
  # =============================================================================
  python-checks:
    name: Run Python checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [lint-and-format, type-check, security-and-compliance, tests, build]
    if: always()
    steps:
      - name: Verify all Python jobs succeeded
        env:
          RESULTS: >-
            ${{ needs.lint-and-format.result }},${{ needs.type-check.result }},${{ needs.security-and-compliance.result }},${{ needs.tests.result }},${{ needs.build.result }}
        run: |
          echo "Python job results: $RESULTS"
          if [[ "$RESULTS" != "success,success,success,success,success" ]]; then
            echo "::error::One or more Python checks did not succeed: $RESULTS"
            exit 1
          fi
