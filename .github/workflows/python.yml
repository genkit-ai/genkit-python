name: Python Checks

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint-and-format:
    name: Lint and Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install uv and setup Python
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen --group lint

      - name: Check lockfile is up to date
        run: uv lock --check

      - name: Format check
        run: uv run --no-sync ruff format --check --preview .

      - name: Lint with ruff
        run: uv run --no-sync ruff check --preview .

      - name: Run consistency checks
        run: python3 ./scripts/check_consistency.py

      - name: Ensure minor/patch Dependabot PRs only update uv.lock
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.user.login == 'dependabot[bot]' &&
          (startsWith(github.head_ref, 'dependabot/uv/py-minor-and-patch') ||
           startsWith(github.head_ref, 'dependabot/uv/py-dependencies'))
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          touched=$(git diff --name-only "$BASE_SHA" HEAD -- 'packages/*/pyproject.toml')
          if [[ -n "$touched" ]]; then
            echo "::error title=Unexpected pyproject.toml edit::Routine minor/patch Dependabot PRs must only update uv.lock, not published bounds in packages/*/pyproject.toml ($touched). Revert the pyproject.toml edit and run 'uv lock'."
            exit 1
          fi

  type-check:
    name: Type Check (${{ matrix.checker }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        checker: [ty, pyrefly, pyright]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential libffi-dev cmake libjpeg-dev zlib1g-dev

      - name: Install uv and setup Python
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen --group lint

      - name: Generate schema typing
        run: ./bin/generate_schema_typing --ci

      - name: Type check with Ty
        if: matrix.checker == 'ty'
        run: uv run --no-sync ty check .

      - name: Type check with Pyrefly
        if: matrix.checker == 'pyrefly'
        run: uv run --no-sync pyrefly check

      - name: Type check with Pyright
        if: matrix.checker == 'pyright'
        run: uv run --no-sync pyright

  security-and-compliance:
    name: Security and Compliance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install uv and setup Python
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen --group lint

      - name: Check source file license headers
        run: ./bin/check_license

      - name: Check Python dependency licenses
        run: uv run --no-sync liccheck -s pyproject.toml

      - name: Check for hardcoded secrets
        run: |
          if grep -rE "(sk-[a-zA-Z0-9]{20,}|AIza[a-zA-Z0-9_-]{35}|AKIA[0-9A-Z]{16})" \
              packages/ samples/ --include="*.py" | grep -vE "test|mock|fake|example|#"; then
            echo "::error::Potential hardcoded secrets found"
            exit 1
          fi
          echo "No hardcoded secrets detected"

  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
      fail-fast: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libffi-dev cmake libjpeg-dev zlib1g-dev

      - name: Install uv and setup Python
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        env:
          PY_VER: ${{ matrix.python-version }}
        run: uv sync --frozen --python "$PY_VER"

      - name: Generate schema typing
        run: ./bin/generate_schema_typing --ci

      - name: Fetch cross-SDK conformance specs
        run: |
          SPEC_DIR="${RUNNER_TEMP:-/tmp}/genkit-specs"
          mkdir -p "$SPEC_DIR"
          curl -sSfL https://raw.githubusercontent.com/genkit-ai/genkit/main/tests/specs/agent.yaml -o "$SPEC_DIR/agent.yaml"
          curl -sSfL https://raw.githubusercontent.com/genkit-ai/genkit/main/tests/specs/generate.yaml -o "$SPEC_DIR/generate.yaml"
          curl -sSfL https://raw.githubusercontent.com/genkit-ai/genkit/main/tests/specs/reflection_api.yaml -o "$SPEC_DIR/reflection_api.yaml"
          curl -sSfL https://raw.githubusercontent.com/genkit-ai/genkit/main/tests/flow_server_tests.yaml -o "$SPEC_DIR/flow_server_tests.yaml"
          curl -sSfL https://raw.githubusercontent.com/genkit-ai/genkit/main/genkit-tools/genkit-schema.json -o "$SPEC_DIR/genkit-schema.json"
          echo "GENKIT_SPECS_DIR=$SPEC_DIR" >> "$GITHUB_ENV"

      - name: Run tests
        env:
          PY_VER: ${{ matrix.python-version }}
          COVERAGE_CORE: sysmon
        run: |
          if [[ "$PY_VER" == "3.12" ]]; then
            uv run --no-sync --python "$PY_VER" \
              pytest --cov --cov-report=term-missing:skip-covered
          else
            uv run --no-sync --python "$PY_VER" pytest
          fi

  # Floors in packages/*/pyproject.toml are what users resolve against, but the
  # tests job only runs uv.lock (newest). This job resolves every direct dep at
  # its declared floor. If it fails, the PR started using a newer API: run
  # `bin/find_min_dep_version <package> <dep>` and raise the floor in the same PR.
  tests-minimum-deps:
    name: Tests (minimum pyproject.toml versions, Python 3.10)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libffi-dev cmake libjpeg-dev zlib1g-dev

      - name: Install uv and setup Python
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
          python-version: "3.10"

      - name: Resolve direct deps at their floors
        run: |
          uv lock --resolution lowest-direct
          echo "=== Direct deps downgraded from uv.lock -> declared floors ==="
          git diff -U1 uv.lock | grep -E '^[ +-](name|version) = ' || echo 'uv.lock already at floors'

      - name: Install dependencies
        run: uv sync --frozen --python 3.10

      - name: Generate schema typing
        run: ./bin/generate_schema_typing --ci

      - name: Run tests
        run: uv run --no-sync --python 3.10 pytest

      - name: Print self-triage guide on failure
        if: failure()
        run: |
          cat <<'EOF' | tee -a "$GITHUB_STEP_SUMMARY"
          ### `tests-minimum-deps` failed — how to fix

          This job tests `packages/*/pyproject.toml` at their minimum `>=` versions (`uv lock --resolution lowest-direct`). If regular `tests` passed and this job failed, a package calls an API newer than its declared floor.

          1. **Find the failing package & dep** from the pytest traceback above (e.g. `packages/genkit-openai/tests/...` -> package `genkit-openai`, dep `openai`; check the `Resolve direct deps` step above to see which deps moved down).
          2. **Auto-bump the exact minimum passing floor and refresh `uv.lock`:**
             ```bash
             bin/find_min_dep_version <package> <dep> --apply
             ```
             *(Shortcut if `find_min_dep_version` has too many releases to search: set the floor in `packages/<package>/pyproject.toml` straight to the version in `uv.lock`, then run `uv lock`.)*
          3. **Verify policy & commit** `packages/<package>/pyproject.toml` + `uv.lock` (keep existing `<N` caps intact; see `docs/dependencies.md`):
             ```bash
             python3 scripts/check_consistency.py
             ```
          EOF
          echo "::error title=tests-minimum-deps failed::A declared '>=' floor in packages/*/pyproject.toml is too old. Run 'bin/find_min_dep_version <package> <dep> --apply' locally (see step log / summary for full steps and docs/dependencies.md)."

  build:
    name: Build Distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    if: always() && !failure() && !cancelled()
    needs: [lint-and-format, type-check, security-and-compliance, tests, tests-minimum-deps]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Build and verify distributions
        run: ./bin/build_dists

      - name: Install each wheel in an isolated venv
        run: ./bin/check_isolated_wheels

      - name: Verify wheel contents
        run: |
          ERRORS=0
          for wheel in dist/*.whl; do
            if [[ -f "$wheel" ]]; then
              wheel_name=$(basename "$wheel" | sed 's/-[0-9].*//')
              if [[ "$wheel_name" == "genkit" ]] || [[ "$wheel_name" == genkit_* ]]; then
                echo "Checking $wheel_name..."
                if ! unzip -l "$wheel" 2>/dev/null | grep -qE "py\.typed$"; then
                  echo "::error::Wheel $wheel_name missing py.typed"
                  ERRORS=$((ERRORS + 1))
                fi
                if ! unzip -l "$wheel" 2>/dev/null | grep -qE "(LICENSE|licenses/LICENSE)"; then
                  echo "::error::Wheel $wheel_name missing LICENSE"
                  ERRORS=$((ERRORS + 1))
                fi
              fi
            fi
          done
          if [[ "$ERRORS" -gt 0 ]]; then
            echo "::error::$ERRORS wheel verification errors found"
            exit 1
          fi

      - name: Upload distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-distributions
          path: dist/
          retention-days: 7

  # =============================================================================
  # Single fan-in gate job for branch protection required_status_checks
  # =============================================================================
  python-checks:
    name: Run Python checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [lint-and-format, type-check, security-and-compliance, tests, tests-minimum-deps, build]
    if: always()
    steps:
      - name: Verify all Python jobs succeeded
        env:
          RESULTS: >-
            ${{ needs.lint-and-format.result }},${{ needs.type-check.result }},${{ needs.security-and-compliance.result }},${{ needs.tests.result }},${{ needs.tests-minimum-deps.result }},${{ needs.build.result }}
        run: |
          echo "Python job results: $RESULTS"
          if [[ "$RESULTS" != "success,success,success,success,success,success" ]]; then
            echo "::error::One or more Python checks did not succeed: $RESULTS"
            exit 1
          fi
